name: Deploy Special40

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ── Frontend build ─────────────────────────
      - name: Install deps
        run: npm ci

      - name: Build
        run: NODE_OPTIONS="--max-old-space-size=4096" npm run build

      # ── SSH setup ──────────────────────────────
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.LINODE_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p 4974 -H ${{ secrets.LINODE_HOST }} >> ~/.ssh/known_hosts
          echo "Host ${{ secrets.LINODE_HOST }}
            Port 4974
            IdentityFile ~/.ssh/id_ed25519
            StrictHostKeyChecking no" > ~/.ssh/config

      # ── Rsync artifacts to server ──────────────
      - name: Sync app
        run: |
          rsync -avz --delete \
            -e "ssh -p 4974" \
            --exclude='node_modules' \
            --exclude='.env*' \
            --exclude='.next/cache' \
            --exclude='.git' \
            ./ root@${{ secrets.LINODE_HOST }}:/var/www/special40-lp/

      # ── Install prod deps + restart ────────────
      - name: Restart app
        run: |
          ssh -p 4974 root@${{ secrets.LINODE_HOST }} << 'EOF'
            set -e

            cd /var/www/special40-lp
            npm ci --omit=dev
            rm -rf .next/cache

            pm2 restart special40-lp --update-env
            pm2 save
          EOF
